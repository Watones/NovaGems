# ============================================================================
#  Fly de NovaGems
#  - Mantiene el /fly al usar /home, /warp, /tp, carteles-elevador, portales,
#    barcos, caballos, al morir y al cambiar de modo de juego.
#  - Al entrar al servidor se activa solo a quien tenga permiso.
#  - Se quita en combate (al pegar o recibir un golpe de otro jugador) y en los
#    mundos/zonas bloqueados; vuelve solo al terminar el combate o salir de la zona.
#  - Quien tenga fly TEMPORAL (comprado o por rango temporal) ve el tiempo que le
#    queda arriba de la hotbar. Al llegar a cero pierde el fly y el permiso, y
#    recibe caída lenta para no morir.
#  El staff con el permiso novagems.fly.bypass (OP por defecto) ignora los
#  bloqueos. Recarga con /novagems reload.
# ============================================================================

# Apágalo con false si alguna vez quieres desactivar todo este sistema.
enabled: true

# Permisos que dan derecho a volar (el de tu /fly). Con tener uno basta.
permissions:
  - essentials.fly

# Activa el fly automáticamente al entrar a todo el que tenga permiso.
enable-on-join: true

# Quita el vuelo a quien lo tenga activo SIN permiso (por ejemplo, porque se le
# acabó el tiempo). Si otro plugin da fly sin permiso (islas, parcelas...),
# ponlo en false.
remove-without-permission: true

# Mundos donde no se puede volar (nombre exacto de Multiverse). Ejemplo:
# blocked-worlds:
#   - pvp
#   - world_nether
blocked-worlds: []

# Regiones de WorldGuard donde no se puede volar (el nombre de la región). Ejemplo:
# blocked-regions:
#   - arena
#   - spawn
blocked-regions: []

# Al pegarle a otro jugador o recibir su golpe, ambos pierden el fly durante
# tag-seconds. Ponlo igual que el tiempo de combate de DeluxeCombat.
combat:
  enabled: true
  tag-seconds: 15

# Cuando se le quita el fly a alguien en el aire, cae lento hasta tocar el suelo
# (como máximo max-seconds) para que no muera.
slow-falling:
  enabled: true
  max-seconds: 60

# Texto arriba de la hotbar para quien tiene fly temporal y lo tiene activado.
# <label> = label-permission (fly comprado) o label-rank (fly por rango temporal).
# <time> = tiempo restante, por ejemplo 5h 58m 29s.
actionbar:
  enabled: true
  format: "<aqua>» <bold>¡VUELO ACTIVADO!</bold> <gold>▸ <label>: <yellow><time>"
  label-permission: "Tiempo Fly"
  label-rank: "Tiempo Rango"

# Deja un mensaje en "" para no mostrarlo.
messages:
  combat: "<red>Estás en combate, tu vuelo se desactivó."
  blocked-zone: "<red>No puedes volar en esta zona."
  expired: "<red>Tu tiempo de vuelo terminó."
  no-permission: "<red>Ya no tienes permiso para volar."
  restored: "<green>Tu vuelo se reactivó."
